<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
/*__LIB_START__*/
// BEGIN lib/focus.js
// Input items use PDF viewport coordinates: x, y (baseline), width, height, text.
function findGutter(items,pageWidth){
 if(items.length<4)return null;
 const minX=Math.min(...items.map(i=>i.x)),maxX=Math.max(...items.map(i=>i.x+i.width));
 const width=pageWidth||maxX-minX,origin=pageWidth?0:minX;
 if(!(width>0))return null;
 const bins=600,counts=new Uint32Array(bins);
 for(const item of items){const a=Math.max(0,Math.floor((item.x-origin)/width*bins)),b=Math.min(bins-1,Math.ceil((item.x+item.width-origin)/width*bins));for(let j=a;j<=b;j++)counts[j]++}
 const low=Math.floor(bins*.3),high=Math.ceil(bins*.7),limit=Math.max(1,Math.floor(items.length*.09));
 let best=null;
 for(let i=low;i<high;){if(counts[i]>limit){i++;continue}let j=i;while(j<high&&counts[j]<=limit)j++;const start=origin+i/bins*width,end=origin+j/bins*width,center=(start+end)/2;
 const left=items.filter(x=>x.x+x.width<=center).length,right=items.filter(x=>x.x>=center).length;
 if(end-start>=width*.015&&left>=2&&right>=2){const score=(end-start)/width-Math.abs(center-(origin+width/2))/width*.12-Math.abs(left-right)/items.length*.05;if(!best||score>best.score)best={start,end,center,score}}
 i=j}
 return best;
}
function rowGroups(items,tolerance,unitScale=1){const rows=[];for(const item of items.sort((a,b)=>a.y-b.y||a.x-b.x)){let row=rows.find(r=>Math.abs(r.y-item.y)<=Math.max(tolerance*unitScale,Math.min(r.height,item.height)*.35));if(!row){row={y:item.y,height:item.height,items:[]};rows.push(row)}row.items.push(item);row.y=(row.y*(row.items.length-1)+item.y)/row.items.length;row.height=Math.max(row.height,item.height)}
 return rows.flatMap(row=>{const groups=[];for(const item of row.items.sort((a,b)=>a.x-b.x)){let group=groups.at(-1);if(!group||item.x-(group.x+group.width)>Math.max(18*unitScale,item.height*1.8)){group={x:item.x,y:row.y,width:0,height:row.height,items:[]};groups.push(group)}group.items.push(item);group.width=Math.max(group.width,item.x+item.width-group.x)}return groups.map(g=>({...g,text:g.items.map(i=>i.text).join(' ').replace(/\s+/g,' ').trim()}))})}
function orderHorizontalSegments(left,right,bodyHeight){const all=[...left,...right].sort((a,b)=>a.y-b.y);if(!all.length)return [];const cuts=[];for(let i=1;i<all.length;i++)if(all[i].y-all[i-1].y>=bodyHeight*2.5)cuts.push((all[i].y+all[i-1].y)/2);const ordered=[];let from=-Infinity;for(const to of [...cuts,Infinity]){ordered.push(...left.filter(x=>x.y>from&&x.y<to),...right.filter(x=>x.y>from&&x.y<to));from=to}return ordered}
function clusterLines(items,{tolerance=4,pageWidth}={}){
 const words=items.filter(i=>i.text?.trim()).map(i=>({...i,x:Number(i.x),y:Number(i.y),width:Number(i.width)||0,height:Number(i.height)||10}));
 if(!words.length)return [];
 const heights=words.map(i=>i.height).sort((a,b)=>a-b);const unitScale=(heights[Math.floor(heights.length/2)]||10)/10;
 const gutter=findGutter(words,pageWidth);
 let ordered;
 if(!gutter)ordered=rowGroups(words,tolerance,unitScale).sort((a,b)=>a.y-b.y||a.x-b.x);
 else{
  const left=[],right=[],full=[];
  for(const item of words){if(item.x+item.width<=gutter.center)left.push(item);else if(item.x>=gutter.center)right.push(item);else full.push(item)}
  const L=rowGroups(left,tolerance,unitScale).sort((a,b)=>a.y-b.y||a.x-b.x),R=rowGroups(right,tolerance,unitScale).sort((a,b)=>a.y-b.y||a.x-b.x),F=rowGroups(full,tolerance,unitScale).sort((a,b)=>a.y-b.y||a.x-b.x);
  ordered=[];let previous=-Infinity;
  for(const f of F){ordered.push(...orderHorizontalSegments(L.filter(x=>x.y>previous&&x.y<f.y),R.filter(x=>x.y>previous&&x.y<f.y),heights[Math.floor(heights.length/2)]),f);previous=f.y}
  ordered.push(...orderHorizontalSegments(L.filter(x=>x.y>previous),R.filter(x=>x.y>previous),heights[Math.floor(heights.length/2)]));
 }
 return ordered.map((r,index)=>({index,x:r.x,y:r.y,width:r.width,height:r.height,text:r.text}));
}

// END lib/focus.js
// BEGIN lib/markdown-focus.js
// Rectangles are viewport-independent page coordinates. Code/table blocks
// are supplied as one atomic rectangle by the caller.
function groupVisualRects(rects,tolerance=3){const sorted=rects.filter(r=>r.right>r.left&&r.bottom>r.top).sort((a,b)=>a.top-b.top||a.left-b.left);const lines=[];for(const r of sorted){let line=!r.atomic&&lines.find(l=>!l.atomic&&l.blockIndex===r.blockIndex&&Math.abs(l.top-r.top)<=tolerance);if(!line){line={top:r.top,bottom:r.bottom,left:r.left,right:r.right,blockIndex:r.blockIndex,atomic:!!r.atomic,text:r.text||'',blockLine:0};lines.push(line)}else{line.top=Math.min(line.top,r.top);line.bottom=Math.max(line.bottom,r.bottom);line.left=Math.min(line.left,r.left);line.right=Math.max(line.right,r.right);if(r.text)line.text+=' '+r.text}}const counts=new Map();for(const l of lines){l.blockLine=counts.get(l.blockIndex)||0;counts.set(l.blockIndex,l.blockLine+1)}return lines}

// END lib/markdown-focus.js
// BEGIN lib/speech-voices.js
const YEAR=/\b(?:19|20)\d{2}[a-z]?\b/;
// Citations: numeric [12], [13, 14]; author-year [Name et al., 2014] / (Name, 2014); and author-year brackets cut by a line break.
function filterSpokenText(text){let value=String(text||'').trim();if(/^\d+$/.test(value))return '';
 value=value.replace(/\[\s*\d+(?:\s*[,，–-]\s*\d+)*\s*\]/g,'');
 value=value.replace(/[\[(]([^\[\]()]{0,160})[\])]/g,(m,inner)=>YEAR.test(inner)&&(/[A-Z]/.test(inner)||/^\s*(?:19|20)\d{2}[a-z]?\s*$/.test(inner))?'':m);
 const open=value.lastIndexOf('[');if(open>=0&&value.indexOf(']',open)<0&&YEAR.test(value.slice(open))||open>=0&&value.indexOf(']',open)<0&&/et al/.test(value.slice(open)))value=value.slice(0,open);
 const close=value.indexOf(']');if(close>=0&&value.lastIndexOf('[',close)<0&&YEAR.test(value.slice(0,close)))value=value.slice(close+1);
 return value.replace(/\s+([,.;:])/g,'$1').replace(/^[\s,.;:]+(?=\S)/,m=>/^\s*[.]/.test(m)?'':'').replace(/\s+/g,' ').trim()}
function preparePdfSpeechLine(lines,index){let text=lines[index]?.text||'';if(index>0){const previous=lines[index-1]?.text?.trim()||'';if(/-$/.test(previous)&&/^[a-z]+/.test(text.trimStart()))text=text.trimStart().replace(/^[a-z]+\b\s*/, '')}
 const next=lines[index+1]?.text?.trimStart()||'';if(/-$/.test(text.trimEnd())&&/^[a-z]+/.test(next)){const first=next.match(/^[a-z]+/)[0];text=text.trimEnd().slice(0,-1)+first}return filterSpokenText(text)}
function languageForText(text){const chinese=(String(text).match(/[\u3400-\u9fff]/g)||[]).length,latin=(String(text).match(/[A-Za-z0-9]/g)||[]).length;return chinese/(chinese+latin||1)>.3?'zh':'en'}
const SPEECH_RATES=[0.8,1,1.2,1.5,2];
function nextSpeechRate(rate){const i=SPEECH_RATES.findIndex(x=>Math.abs(x-Number(rate))<.001);return SPEECH_RATES[(i+1)%SPEECH_RATES.length]}
function formatSpeechRate(rate){return `${Number(rate).toFixed(1)}×`}
const NOVELTY=['Albert','Bad News','Bahh','Bells','Boing','Bubbles','Cellos','Good News','Jester','Organ','Superstar','Trinoids','Whisper','Wobble','Zarvox','Fred','Junior','Kathy','Ralph','Eddy','Flo','Grandma','Grandpa','Reed','Rocko','Sandy','Shelley'];
const EN_PREFERRED=['Ava','Zoe','Evan','Samantha','Allison','Susan','Tom','Karen','Daniel','Serena','Moira'];
const ZH_PREFERRED=['Lili','Yue','Tingting','Meijia','Sinji'];
function isNoveltyVoice(name){return NOVELTY.some(x=>String(name||'').toLowerCase().startsWith(x.toLowerCase()))}
function voicesForLanguage(voices,language){const prefix=language==='zh'?'zh':'en';return Array.from(voices||[]).filter(v=>String(v.lang||'').toLowerCase().startsWith(prefix))}
function chooseDefaultVoice(voices,language){
 const candidates=voicesForLanguage(voices,language).filter(v=>!isNoveltyVoice(v.name));
 const preferred=language==='zh'?ZH_PREFERRED:EN_PREFERRED;
 const rank=v=>{const name=String(v.name||'');if(/premium/i.test(name))return [0,0];if(/enhanced/i.test(name))return [1,0];const i=preferred.findIndex(x=>name.toLowerCase().startsWith(x.toLowerCase()));if(i>=0)return [2,i];return [3,/^zh[-_]cn$/i.test(v.lang)||/^en[-_]us$/i.test(v.lang)?0:1]};
 return candidates.sort((a,b)=>{const x=rank(a),y=rank(b);return x[0]-y[0]||x[1]-y[1]})[0]||null;
}

// END lib/speech-voices.js
// BEGIN lib/line-speech.js
// Shared, UI-independent speech progression for PDF and Markdown.
// Only the current utterance token may advance. A manual jump invalidates
// callbacks before cancel(), because Gecko may call onend/onerror on cancel.
function createLineSpeechController({getText,advance,paint,speak,cancel,onStateChange=()=>{}}){
 let active=false,token=0;
 const stop=()=>{const wasActive=active;active=false;token++;cancel();if(wasActive)onStateChange(false)};
 function play(){
  const generation=token;
  function attempt(skipped){
   if(!active||generation!==token)return;
   paint();
   const result=getText();
   if(result&&typeof result.then==='function'){void result.then(text=>continueWith(text,skipped));return}
   continueWith(result,skipped);
  }
  function continueWith(text,skipped){
   if(!active||generation!==token)return;
   if(text){
    const mine=++token;
    speak(text,{
     onstart:()=>{if(active&&mine===token)paint()},
     onend:()=>{if(active&&mine===token)void finished(mine)},
     onerror:error=>{if(!active||mine!==token)return;if(error==='interrupted'||error==='canceled')return;stop()}
    });
    return;
   }
   if(skipped>=50){stop();return}
   Promise.resolve(advance(()=>active&&generation===token)).then(moved=>{if(!moved){if(active&&generation===token)stop();return}attempt(skipped+1)});
  }
  attempt(0);

  const data=part.split('\n').filter(line=>line.startsWith('data:')).map(line=>line.slice(5).trimStart()).join('\n');

function contextForLines(lines,index,max=MAX_CONTEXT){

  const left=start>0?String(lines[start-1]?.text||'').length+1:Infinity;

function pdfViewportPages(heights, scrollTop, viewportHeight, loaded=[], maxPages=6){

 for(let index=0;index<heights.length;index++){
  const bottom=top+Math.max(0,Number(heights[index])||0);
  if(bottom>=releaseStart&&top<=releaseEnd)keep.add(index);
  if(bottom>=renderStart&&top<=renderEnd){
   near.push({index,distance:Math.max(0,top-center,center-bottom)});

}
